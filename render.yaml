# AfriCart — Deploy configuration (split architecture)
#
# This repository now contains two independently deployable Next.js applications:
#
#   backend/  -> AfriCart API (API-only, Postgres + Cloudinary + email)
#                Deployed on Render as the service below.
#   frontend/ -> AfriCart storefront UI (no server code, no DB access)
#                Deployed on Vercel or Netlify (configure there, see comment below).
#
# Frontend hosting (Vercel/Netlify) required env vars:
#   RECOMMENDED (Option A - same-origin proxy): leave NEXT_PUBLIC_API_URL EMPTY and
#   set only API_INTERNAL_URL = https://<this-api-service>.onrender.com (server-side).
#   The browser then calls the frontend's own /api/* (first-party cookies, no CORS),
#   and the frontend's next.config rewrites proxy those to the backend. This is the
#   only mode where the edge route guards can see the auth cookies and where login
#   survives third-party cookie blocking.
#   OPTION B (direct cross-origin, fragile): NEXT_PUBLIC_API_URL = https://<this-api-service>.onrender.com
#   With Option B every auth cookie is a cross-site third-party cookie, which many
#   browsers block/enqueue; logins appear to "succeed" but sessions never persist.
#   NEXT_PUBLIC_APP_URL  = https://<frontend-domain> (public frontend origin)
#
# IMPORTANT one-time prerequisite before the first deploy that uses migrate deploy:
# the existing production DB was created via `prisma db push` and already has the
# full schema. Run the following against the Render database ONCE (it only records
# the baseline migration as applied; it makes NO schema/data changes):
#   npx prisma migrate resolve --applied 0_init
# Then deploy. `migrate deploy` applies only NEW changes going forward (non-destructive).

services:
  - type: web
    name: africart-api
    rootDir: backend
    env: node
    # 0_init failed once on a fresh DB (BOM bug) leaving a "failed" record that blocks
    # migrate deploy (P3009). Self-heal: if deploy fails, mark 0_init rolled back (it
    # errored on its very first statement, so nothing persisted) and retry once. This is
    # safe when 0_init is already applied (resolve refuses to un-apply it) and only runs
    # when the first deploy attempt failed.
    #
    # db:reconcile replays 0_init with IF NOT EXISTS semantics so a database that was
    # created via `prisma db push` (whose 0_init is only "resolved as applied", so
    # migrate deploy never creates its objects) still gets any missing tables/columns/
    # enums/indexes. Non-destructive; safe to run on every deploy.
    #
    # db:seed bootstraps the required roles/categories and the admin account. It is
    # idempotent and never overwrites an existing admin password.
    buildCommand: npm install && (npx prisma migrate deploy || (npx prisma migrate resolve --rolled-back 0_init && npx prisma migrate deploy)) && npm run db:reconcile && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: africart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://africart-3bt5.onrender.com
      # Comma-separated frontend origins allowed for CORS. This MUST match the real
      # deployed frontend origin(s) or the browser blocks every cross-origin request
      # (login/register will fail). Add each frontend URL:
      #   - https://africart-3bt5.onrender.com   (the actual deployed frontend)
      #   - https://www.africart.com             (future production domain)
      - key: ALLOWED_ORIGINS
        value: https://africart-3bt5.onrender.com,https://www.africart.com
      # Auth cookies are FIRST-PARTY: the browser only ever talks to the same-origin
      # /api/* (the frontend proxies /api/* -> this backend). A cross-origin (CORS)
      # setup is NOT used here, so SameSite=lax is correct and keeps cookies working
      # under third-party-cookie blocking. Only switch to "none" if the frontend ever
      # calls this backend's origin directly from a different site.
      - key: COOKIE_SAME_SITE
        value: lax
      - key: LOG_LEVEL
        value: info
      # Credentials below are set in the Render dashboard (sync: false prevents this
      # file from overriding them / forcing values into the diff).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Daily maintenance: prune expired/used verification & reset tokens.
  # Idempotent — safe to re-run. Free on Render's free plan.
  - type: cron
    name: africart-maintenance
    rootDir: backend
    env: node
    schedule: "0 3 * * *"
    startCommand: npm run job:maintenance
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: africart-db
          property: connectionString

databases:
  - name: africart-db
    plan: starter
    databaseName: africart