services:
  - type: web
    name: africart
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: africart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://your-app.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_NODE_ENV
        value: production

databases:
  - name: africart-db
    plan: starter
    databaseName: africart
